# Try GaiaCP on your own machine: docker compose up, then open http://localhost:8080/admin (docs/docker.md).
# Change the passwords below before you put anything real in it.
services:
  app:
    build: .
    image: gaiacp:local
    ports:
      - "8080:80"
    environment: &environment
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gaiacp
      DB_USERNAME: gaiacp
      DB_PASSWORD: gaiacp-db-password
      # The first admin, made on the first start (leave GAIACP_ADMIN_EMAIL empty to use the web installer at /install)
      GAIACP_ADMIN_EMAIL: admin@example.com
      GAIACP_ADMIN_PASSWORD: change-me-now
      GAIACP_COMPANY: My hosting company
      GAIACP_TIMEZONE: Europe/Athens
      # Emails are written to storage/logs/laravel.log until you set a mail server under Settings → Mail
      MAIL_MAILER: log
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # The cron job: the daily automation, reminders, queued emails (php artisan schedule:work)
  scheduler:
    image: gaiacp:local
    pull_policy: never
    environment:
      <<: *environment
      GAIACP_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: gaiacp
      MARIADB_USER: gaiacp
      MARIADB_PASSWORD: gaiacp-db-password
      MARIADB_ROOT_PASSWORD: gaiacp-root-password
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  storage:
  database:
