name: Bug report
description: Something in GaiaCP doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Please don't post it here: report it privately (see SECURITY.md).
        Remove client data, server addresses, passwords and tokens from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GaiaCP version
      description: Shown in the admin footer, e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: PHP version, database and web server
      placeholder: PHP 8.3, MariaDB 10.11, Apache (shared hosting)
  - type: textarea
    id: logs
    attributes:
      label: Error log
      description: Settings → Error log, or storage/logs/laravel.log, if there is anything relevant.
      render: text
