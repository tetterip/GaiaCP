name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the tests first
  schedule:
    - cron: '0 5 * * 1' # Mondays: a new security advisory fails composer audit even without a push

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security advisories
        run: composer audit --locked --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test

